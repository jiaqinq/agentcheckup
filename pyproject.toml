[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcheckup"
version = "0.9.0"
description = "MCP tool conflict detector and config auditor for AI agents: cross-server name collisions, risky MCP settings, and tool-manifest token overhead."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jiaqinq" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "mcp-server",
  "mcp-tools",
  "mcp-linter",
  "mcp-tool-conflicts",
  "mcp-config-audit",
  "ai-agents",
  "agent-tools",
  "github-actions",
  "static-analysis",
  "python-cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentcheckup = "agentcheckup.cli:main"

[project.urls]
Homepage = "https://github.com/jiaqinq/agentcheckup"
Issues = "https://github.com/jiaqinq/agentcheckup/issues"
Changelog = "https://github.com/jiaqinq/agentcheckup/blob/main/CHANGELOG.md"
"Rule reference" = "https://github.com/jiaqinq/agentcheckup/blob/main/docs/rules.md"
"GitHub Action" = "https://github.com/jiaqinq/agentcheckup/blob/main/docs/github-action.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcheckup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
