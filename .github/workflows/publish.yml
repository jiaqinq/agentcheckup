name: Publish

# Publishes to PyPI using Trusted Publishing (OIDC). No API token is stored
# anywhere: PyPI trusts this repository's workflow identity directly.
#
# One-time setup on PyPI (the project does not exist yet, so use "pending
# publisher"):
#   https://pypi.org/manage/account/publishing/
#     PyPI Project Name : agentcheckup
#     Owner             : wanjiaqing
#     Repository name   : agentcheckup
#     Workflow name     : publish.yml
#     Environment       : pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment name" field of the PyPI pending publisher.
    # PyPI recommends a dedicated environment so that only this job can publish.
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
